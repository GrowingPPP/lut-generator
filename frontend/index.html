<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark" data-theme-preference="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        let preference = 'dark'
        try {
          const saved = window.localStorage.getItem('chroma-theme')
          if (['dark', 'gray', 'light', 'system'].includes(saved)) preference = saved
        } catch {}
        let theme = preference
        if (preference === 'system') {
          try { theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light' }
          catch { theme = 'dark' }
        }
        document.documentElement.setAttribute('data-theme', theme)
        document.documentElement.setAttribute('data-theme-preference', preference)
      })()
    </script>
    <title>CHROMA — 松下 LUT 生成器</title>
    <meta
      name="description"
      content="从照片与灵感出发，用 AI 和手动工具调整色彩，保存可复用的 LUT，或导出调整后的照片。"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
